name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: package-lock.json
        
      - name: Instalação das dependências
        run: npm install
        
      - name: Rodar o buld
        run: npm run build
        env:
          API_REDEMET: ${{ secrets.API_REDEMET }}
          BASE_URL_REDEMET: ${{ vars.BASE_URL_REDEMET }}
  tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: package-lock.json
        
      - name: Instalação das dependências
        run: npm install
      
      - name: Rodaando o Lint
        run: npm run lint

      - name: Verificando formatação
        run: run run format

      - name: Testando
        run: npm run test
      
