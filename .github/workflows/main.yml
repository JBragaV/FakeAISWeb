name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '*.config.*'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '*.config.*'
  workflow_dispatch:
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  API_REDEMET: ${{ secrets.API_REDEMET }}
  BASE_URL_REDEMET: ${{ vars.BASE_URL_REDEMET }}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm ci

      - name: Rodando o Lint e formatando
        run: |
          npm run lint
          npm run check

      - name: Testando
        run: npm run test
  build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalação das dependências
        run: npm ci

      - name: Rodar o buld
        run: npm run build

  deploy:
    name: Vercel Production Deployment
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Debug env
        run: |
          echo "API_REDEMET=${{ secrets.API_REDEMET != '' }}"
          echo "BASE_URL_REDEMET=${{ vars.BASE_URL_REDEMET != '' }}"

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Project Artifacts to Vercel
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
