name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/**"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: package-lock.json
        
      - name: Instalação das dependências
        run: npm install
        
      - name: Rodar o buld
        run: npm run build
        env:
          API_REDEMET: ${{ secrets.API_REDEMET }}
          BASE_URL_REDEMET: ${{ vars.BASE_URL_REDEMET }}
  tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: package-lock.json
        
      - name: Instalação das dependências
        run: npm install
      
      - name: Rodaando o Lint
        run: npm run lint

      - name: Verificando formatação
        run: npm run format

      - name: Testando
        run: npm run test
  deploy:
    name: Vercel Production Deployment
    needs: tests
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      API_REDEMET: ${{ secrets.API_REDEMET }}
      BASE_URL_REDEMET: ${{ vars.BASE_URL_REDEMET }}
    steps:
      - name: Debug env
        run: |
          echo "API KEY PRESENT: ${{ secrets.API_REDEMET != '' }}" | echo "API KEY PRESENT: ${{ secrets.BASE_URL_REDEMET != '' }}"
      - uses: actions/checkout@v2
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}



















